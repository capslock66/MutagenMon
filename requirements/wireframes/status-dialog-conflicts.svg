<svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #f3f4f6; }
    .win { fill: #ffffff; stroke: #9aa0a6; stroke-width: 1.5; }
    .titlebar { fill: #e8e9eb; stroke: #9aa0a6; }
    .titletext { fill: #1f2328; font-size: 13px; font-weight: 700; }
    .body { fill: #2b2f36; font-size: 12px; font-family: Consolas, monospace; }
    .section { fill: #b45309; font-size: 12px; font-family: Consolas, monospace; font-weight: 700; }
    .btnPrimary { fill: #2f6fed; stroke: #1d4fbf; }
    .btnPrimaryText { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .btn { fill: #f0f0f0; stroke: #8a8f98; }
    .btntext { fill: #1f2328; font-size: 12px; }
    .caption { fill: #1f2328; font-size: 20px; font-weight: 700; }
    .sub { fill: #5b6068; font-size: 12px; }
  </style>
  <rect class="bg" width="640" height="500"/>
  <text class="caption" x="30" y="35">Status view — with unresolved conflicts</text>
  <text class="sub" x="30" y="55">wx.MessageDialog(OK/Cancel, ICON_QUESTION), custom labels "Resolve conflicts" / "Cancel" — TaskBarIcon.on_left_down().</text>

  <g transform="translate(70,80)">
    <rect class="win" x="0" y="0" width="500" height="360" rx="3"/>
    <rect class="titlebar" x="0" y="0" width="500" height="30"/>
    <circle cx="18" cy="15" r="7" fill="#f9a825"/>
    <text class="titletext" x="34" y="19">MutagenMon: conflicts</text>
    <text x="480" y="19" text-anchor="end" font-size="14" fill="#5b6068">✕</text>

    <circle cx="30" cy="55" r="12" fill="#f9a825"/>
    <text x="30" y="60" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">?</text>

    <text class="body" x="55" y="52">2026-08-13 09:41:02</text>
    <text class="body" x="55" y="70">Name: photos-sync</text>
    <text class="body" x="55" y="86">Status: Watching for changes</text>

    <text class="section" x="55" y="130">==================== CONFLICTS ====================</text>
    <text class="body" x="55" y="150">photos-sync: IMG_0231.jpg</text>
    <text class="body" x="55" y="168">photos-sync: notes.txt [autoresolving]</text>
    <text class="body" x="55" y="186">docs-sync: report.docx</text>

    <rect class="btn" x="290" y="310" width="90" height="32" rx="3"/>
    <text class="btntext" x="335" y="331" text-anchor="middle">Cancel</text>
    <rect class="btnPrimary" x="390" y="310" width="100" height="32" rx="3"/>
    <text class="btnPrimaryText" x="440" y="331" text-anchor="middle">Resolve conflicts</text>
  </g>

  <text class="sub" x="30" y="465">"Resolve conflicts" launches the batch resolution workflow (FR-9); autoresolving entries are informational only.</text>
  <text class="sub" x="30" y="483">See screen 5 — conflict-resolution-dialog.svg.</text>
</svg>
