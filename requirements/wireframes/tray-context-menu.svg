<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #f3f4f6; }
    .taskbar { fill: #d6d8db; }
    .menu { fill: #ffffff; stroke: #b9bdc4; stroke-width: 1; }
    .item { fill: #1f2328; font-size: 13px; }
    .itemDisabled { fill: #9aa0a6; font-size: 13px; font-style: italic; }
    .sep { stroke: #e1e2e4; stroke-width: 1; }
    .caption { fill: #1f2328; font-size: 20px; font-weight: 700; }
    .sub { fill: #5b6068; font-size: 12px; }
    .label { fill: #5b6068; font-size: 11px; font-family: Consolas, monospace; }
  </style>
  <rect class="bg" width="900" height="480"/>
  <text class="caption" x="40" y="35">Tray right-click context menu (sketch)</text>
  <text class="sub" x="40" y="55">Source: mutagenmonlib/wx/icon.py — TaskBarIcon.CreatePopupMenu(). See requirements/01-functional-requirements.md FR-7.</text>

  <!-- Normal state menu -->
  <g transform="translate(60,90)">
    <text class="sub" x="0" y="-14" font-weight="700">Normal state</text>
    <circle cx="14" cy="14" r="10" fill="#3fae4a"/>
    <rect class="menu" x="-6" y="34" width="300" height="230" rx="4"/>
    <text class="item" x="14" y="60">Reload config &amp; restart mutagen</text>
    <text class="item" x="14" y="88">Stop Mutagen sessions</text>
    <line class="sep" x1="0" y1="106" x2="288" y2="106"/>
    <text class="item" x="14" y="130">Show status</text>
    <line class="sep" x1="0" y1="148" x2="288" y2="148"/>
    <text class="item" x="14" y="172">Exit MutagenMon</text>
    <text class="label" x="0" y="248">shown when monitoring enabled and idle</text>
  </g>

  <!-- Disabled/paused state menu -->
  <g transform="translate(430,90)">
    <text class="sub" x="0" y="-14" font-weight="700">Monitoring paused by user</text>
    <circle cx="14" cy="14" r="10" fill="#5a5f66"/>
    <rect class="menu" x="-6" y="34" width="300" height="230" rx="4"/>
    <text class="item" x="14" y="60">Reload config &amp; restart mutagen</text>
    <text class="item" x="14" y="88">Start Mutagen sessions</text>
    <line class="sep" x1="0" y1="106" x2="288" y2="106"/>
    <text class="item" x="14" y="130">Show status</text>
    <line class="sep" x1="0" y1="148" x2="288" y2="148"/>
    <text class="item" x="14" y="172">Exit MutagenMon</text>
    <text class="label" x="0" y="248">"Stop" toggles to "Start" (FR-7.2)</text>
  </g>

  <!-- Restarting state menu -->
  <g transform="translate(60,330)">
    <text class="sub" x="0" y="-14" font-weight="700">Restart in progress</text>
    <circle cx="14" cy="14" r="10" fill="#ff9800"/>
    <rect class="menu" x="-6" y="34" width="300" height="110" rx="4"/>
    <text class="itemDisabled" x="14" y="60">Restarting...</text>
    <line class="sep" x1="0" y1="78" x2="288" y2="78"/>
    <text class="item" x="14" y="102">Exit MutagenMon</text>
    <text class="label" x="0" y="128">all other items collapsed (FR-7.5)</text>
  </g>

  <text class="sub" x="430" y="330" font-weight="700">Notes</text>
  <text class="label" x="430" y="352">- Left-click ≠ right-click: left-click opens the status view (screen 3/4),</text>
  <text class="label" x="430" y="368">  right-click opens this menu.</text>
  <text class="label" x="430" y="388">- "Show status" performs the exact same action as left-clicking the icon.</text>
  <text class="label" x="430" y="408">- Menu must be reachable purely from the tray icon (no main window).</text>
</svg>
